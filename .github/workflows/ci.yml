name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned: a new Rust release brings new clippy lints, which would otherwise
  # fail CI without any change in the code. Bump it on purpose from time to time.
  RUST_TOOLCHAIN: "1.99.0"
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libmpv-dev ffmpeg

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: shellcheck
        run: shellcheck install.sh uninstall.sh scripts/*.sh

      # Uploading through the GitHub web interface drops the executable bit,
      # and then `./install.sh` fails for everyone who clones the repository.
      - name: Scripts are executable
        run: |
          for f in install.sh uninstall.sh scripts/*.sh; do
            if [ ! -x "$f" ]; then
              echo "::error file=$f::$f is not executable; fix it with: git update-index --chmod=+x $f"
              exit 1
            fi
          done

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The GTK integration tests (player, ui) skip themselves here: there is no
      # display. The recorder tests run (they need ffmpeg for their test source).
      - name: cargo test
        run: cargo test --workspace

  integration:
    name: integration (${{ matrix.display }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        display: [x11, wayland]
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libmpv-dev libgl1-mesa-dri xvfb xauth weston locales ffmpeg
          # For the starts_under_non_c_locale test (the mpv LC_NUMERIC bug).
          sudo locale-gen ro_RO.UTF-8

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: integration

      - name: libmpv + GTK tests on ${{ matrix.display }}
        env:
          TVMAXE_TEST_CAPTURE: ${{ runner.temp }}/video-capture.png
          TVMAXE_MPV_LOG: ${{ runner.temp }}/mpv.log
        run: bash scripts/integration-tests.sh ${{ matrix.display }}

      - name: Video capture and mpv log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.display }}
          path: |
            ${{ runner.temp }}/video-capture.png
            ${{ runner.temp }}/mpv.log
          if-no-files-found: ignore
