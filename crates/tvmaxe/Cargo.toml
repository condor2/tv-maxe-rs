[package]
name = "tvmaxe"
description = "TV-Maxe: internet TV and radio player for Linux (GTK 4 + libmpv)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
libc = { version = "0.2.190", optional = true }
libloading = { version = "0.9.0", optional = true }
libmpv2 = { version = "6.0.0", optional = true }
tvmaxe-core = { version = "0.1.0", path = "../tvmaxe-core" }

[features]
default = ["mpv"]
# Backend video: libmpv randat în GtkGLArea.
mpv = ["dep:libmpv2", "dep:libloading", "dep:libc"]

[[bin]]
name = "tvmaxe"
path = "src/main.rs"
# Același nume ca biblioteca: documentația doar pentru bibliotecă.
doc = false

[dev-dependencies]
libc = "0.2.190"

# Teste de integrare cu GTK: au nevoie de firul principal și de ecran
# (Xvfb / weston headless în CI), deci fiecare are propriul `main`.
[[test]]
name = "player"
harness = false
required-features = ["mpv"]

[[test]]
name = "ui"
harness = false
