[package]
name = "tvmaxe"
description = "TV-Maxe: internet TV and radio player for Linux (GTK 4 + libmpv)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
libc = { version = "0.2.190", optional = true }
libloading = { version = "0.9.0", optional = true }
libmpv2 = { version = "6.0.0", optional = true }
# Raw events: libmpv2 drops the playlist entry id of START_FILE / END_FILE.
libmpv2-sys = { version = "4.0.1", optional = true }
tvmaxe-core = { version = "0.1.0", path = "../tvmaxe-core" }

[features]
default = ["mpv"]
# Video backend: libmpv rendered into a GtkGLArea.
mpv = ["dep:libmpv2", "dep:libmpv2-sys", "dep:libloading", "dep:libc"]

[[bin]]
name = "tvmaxe"
path = "src/main.rs"
# Same name as the library: documentation only for the library.
doc = false

[dev-dependencies]
libc = "0.2.190"

# Integration tests with GTK: they need the main thread and a display
# (Xvfb / headless Weston in CI), so each one has its own `main`.
[[test]]
name = "player"
harness = false
required-features = ["mpv"]

[[test]]
name = "ui"
harness = false

[[test]]
name = "mpris"
harness = false
